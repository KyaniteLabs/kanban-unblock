name: kanban-unblock
version: "0.2.0"
manifest_version: 2
description: "Kanban Unblock for Hermes: answer blocked kanban cards that need human input (block_kind=needs_input) in place, then unblock. Adds a Needs-input control inside the native Desktop /kanban page (desktop/plugin.js + dashboard/plugin_api.py), /kanban-unblock (queue|show|reply|clarify|unblock|status|help), five kanban_unblock tools, a pre_llm_call queue brief, and a skill. Shell/code/capability approvals are NOT in scope and are refused — install catalog needs-you for those. Disclosure — reaches the board only through the public kanban_list / kanban_show / kanban_comment / kanban_unblock tools (ctx.dispatch_tool in the agent, the tool registry in the backend); never imports hermes_cli.kanban_db; replies and unblocks are operator-driven and refused on messaging gateways unless allow_mutate_on_gateway is set; a short action ledger + queue cache live under <HERMES_HOME>/plugin-data/kanban-unblock/; no secrets, no child processes, no telemetry."
author: "Kyanite Labs"
license: Apache-2.0
homepage: https://github.com/KyaniteLabs/kanban-unblock/tree/main/plugins/kanban-unblock-hermes
tags: [kanban, unblock, clarify, desktop, hackathon]
requires_hermes: ">=0.21.6"
requires_env: []
provides_tools:
  - kanban_unblock_queue
  - kanban_unblock_show
  - kanban_unblock_reply
  - kanban_unblock_clarify
  - kanban_unblock_go
provides_hooks:
  - pre_llm_call
hooks:
  - pre_llm_call
config_schema:
  inject_on_blocked_talk:
    type: bool
    default: true
    description: "When true, pre_llm_call injects a blocked-queue brief if the user message mentions blocked cards / clarify / unblock."
  max_queue:
    type: int
    default: 25
    description: "Max needs_input cards to surface in queue/tools (1-100)."
  allow_mutate_on_gateway:
    type: bool
    default: false
    description: "When false, reply/clarify/unblock are refused when the session identity (gateway ContextVars, HERMES_PLATFORM, or the calling agent platform) is a messaging gateway such as Telegram or Slack."
